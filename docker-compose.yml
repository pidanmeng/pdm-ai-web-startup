services:
  postgres:
    image: postgres:17-alpine
    container_name: xs-ai-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xs_ai_platform
    ports:
      - '5432:5432'
    volumes:
      - xs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d xs_ai_platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xs_pg_data:
